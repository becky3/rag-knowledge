# Quality Check — Caller
#
# PR 作成・更新時の品質チェック（テスト・lint・型チェック・markdownlint）。
# Reusable Workflow (shared-workflows) を呼び出す。
# 設計書: shared-workflows/docs/specs/quality-check.md

name: Quality Check

permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]

# UTF-8 強制環境変数（ローカルジョブに適用、reusable workflow には伝播しないため
# job: quality の test_command にも個別に PYTHONUTF8=1 を埋め込んでいる）。
# 仕様: README「前提: UTF-8 強制環境変数の設定」
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    uses: becky3/shared-workflows/.github/workflows/quality-check.yml@main
    with:
      python_version: "3.11"
      install_command: "uv sync --no-group with-mineru"
      test_command: "PYTHONUTF8=1 PYTHONIOENCODING=utf-8 uv run pytest"
      lint_command: "uv run ruff check src/ tests/"
      typecheck_command: "uv run mypy src/"
      markdownlint: true

  e2e-test:
    # 仕様: docs/specs/infrastructure/fake-mode.md
    # subprocess 越境 Mock E2E テスト。Fake モード（Embedding / YouTube 等）で動作するため
    # CUDA / MinerU は不要。Quality Check (job: quality) と並列実行し、失敗時は workflow 全体が失敗する。
    name: E2E (Mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU only)
        run: uv sync --no-group with-mineru
      - name: Setup keyring with fake API key (CI-only)
        # CI Linux 環境には keyring backend が無いため、keyrings.alt のファイルバックエンドを
        # インストールし、MCP server (HTTP モード) が起動時に必須とする UPLOAD_API_KEY を
        # 登録する。本番運用では OS のセキュアストレージを使用するため、本ステップは CI 専用。
        env:
          PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
        run: |
          uv pip install keyrings.alt
          uv run python -c "import keyring; keyring.set_password('rag-knowledge', 'UPLOAD_API_KEY', 'e2e-fake-upload-api-key-not-for-production')"
      - name: Run E2E tests
        # Fake モード強制は tests/conftest.py の autouse fixture と
        # tests/e2e/conftest.py の e2e_subprocess_env fixture が SSoT として
        # 完全カバーする。CI yml で env を再設定すると二重管理になるため設定しない。
        # PYTHON_KEYRING_BACKEND は前ステップで登録した keyring を読み出すために必要。
        # -n0 は subprocess 起動時の動的ポート確保 TOCTOU race による flaky 化を防ぐため
        # シングルプロセス実行を強制する（pyproject.toml の addopts は -n auto がデフォルト）。
        env:
          PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
        run: uv run pytest tests/e2e/ -m e2e -n0

  validate-package-layout:
    # flat module + package の同名衝突を検出する独立 step。
    # pytest 起動より先に実行することで、テスト経路に依存しない fail-fast を担保する。
    name: Validate Package Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: ".python-version"
      - name: Run validate_package_layout
        run: uv run python scripts/validate_package_layout.py
