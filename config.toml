# RAG Knowledge — 共通設定（git 管理）
# 設定管理仕様: docs/specs/rag-knowledge.md#設定管理

# Embedding モデル
# embedding_model_local（LM Studio ローカル Embedding モデル）は lmstudio.toml が SSoT
embedding_model_online = "text-embedding-3-small"
# Embedding 入力にタスク種別プレフィックス（search_query: / search_document:）を付与
embedding_prefix_enabled = true
# 高並列時の一時的な接続タイムアウトに対応するリトライ（指数バックオフ）
rag_embedding_retry_count = 3
rag_embedding_retry_base_delay = 1.0

# チャンキング
rag_chunk_size = 200
rag_chunk_overlap = 30
# Embedding コンテキスト長（トークン数）。LM Studio の設定値に合わせる
rag_embedding_context_length = 512
# 最悪ケーストークン/文字比率。導出手順: docs/specs/indexer.md「トークン/文字比率の導出手順」
rag_worst_token_char_ratio = 0.7

# 検索
rag_retrieval_count = 10
# rag_similarity_threshold = (未設定時は None)

# ChromaDB コレクション名
chromadb_collection_name = "knowledge"

# ハイブリッド検索（ベクトル検索 + BM25 の併用。運用環境で有効化済み）
rag_hybrid_search_enabled = true
rag_vector_weight = 0.90
rag_bm25_k1 = 2.5
rag_bm25_b = 0.50
# rag_min_combined_score = (未設定時は None)

# URL 安全性チェック (Google Safe Browsing API)
# true にするには keyring に GOOGLE_SAFE_BROWSING_API_KEY の登録が必要
# 未登録・空・不正の場合は SafeBrowsingConfigError で即時中断する
rag_url_safety_check = true
rag_url_safety_cache_ttl = 300
rag_url_safety_timeout = 5.0

# rag_list_recent / list-recent のデフォルト取得件数
rag_list_recent_limit = 20

# ログファイル出力: セッション内ローテーションの閾値（バイト）
rag_log_file_max_bytes = 10485760

# Zenn インジェスター
rag_zenn_max_articles = 100
rag_zenn_request_timeout = 30
rag_zenn_request_interval = 0.1

# ドキュメントインジェスター
rag_document_supported_extensions = ".md,.txt,.pdf,.pptx,.ppsx,.adoc,.jpg,.jpeg,.png,.webp,.mp4,.ts"
# HTTP モードでのドキュメント取り込みを許可するか
rag_document_http_mode_enabled = false
# ドキュメント取り込みで許可するディレクトリ（カンマ区切り、空 = 制限なし）
rag_document_allowed_dirs = ""

# Upload HTTP API
# Upload HTTP API の最大ファイルサイズ（MB）
rag_upload_max_file_size_mb = 500
# ロック競合時の Retry-After ヘッダ値（秒）
rag_upload_retry_after_write_sec = 30
rag_upload_retry_after_rebuild_sec = 300

# HTML 抽出ルール（content_id_patterns / content_class_patterns / remove_class_tokens /
# サイト別 content_selectors / remove_selectors）は site_rules.toml（プロジェクトルート直下）が SSoT。
# 仕様: docs/specs/converter.md「サイト別抽出ルール設定ファイル」

# PDF バックエンド (auto / mineru / pymupdf4llm)
rag_pdf_backend = "auto"
rag_pdf_mineru_mfd_conf_thres = 0.6
rag_pdf_quality_ufffd_threshold = 0.10
rag_pdf_quality_greek_threshold = 0.15
rag_pdf_quality_cjk_min_threshold = 0.05
rag_pdf_quality_min_chars_per_page = 10
rag_pdf_quality_sample_pages = 10

# YouTube インジェスター
rag_youtube_max_videos = 100
rag_youtube_request_interval = 180.0
rag_youtube_request_timeout = 30
rag_youtube_transcript_languages = ["ja", "en"]
rag_youtube_merge_gap_sec = 2.0
rag_youtube_merge_max_chars = 300
rag_youtube_max_duration = 14400

# BlueSky インジェスター
rag_bluesky_appview_url = "https://public.api.bsky.app"
rag_bluesky_max_posts = 200
rag_bluesky_request_timeout = 30
rag_bluesky_request_interval = 1.0
rag_bluesky_include_reposts = true
rag_bluesky_force_youtube_reingest = false

# 青空文庫インジェスター
rag_aozora_max_works = 200
rag_aozora_request_interval = 1.0
rag_aozora_request_timeout = 30

# メディア解析（Vision モデル）
# rag_vision_model（LM Studio Vision モデルの識別子）は lmstudio.toml が SSoT
# Vision API の推論深度（none / low / medium / high）
rag_vision_reasoning_effort = "none"
# 動画フレーム抽出間隔（秒）
rag_vision_frame_interval = 5
# Vision API レスポンスの最大トークン数
rag_vision_max_tokens = 1024
# Vision API リクエストタイムアウト（秒）
rag_vision_api_timeout = 180.0

# HNSW パラメータ（ChromaDB ベクトルインデックス）
# M / construction_ef はコレクション作成時のみ適用。既存コレクションへの反映には rebuild --mode full が必要
# search_ef は起動時に collection.modify() で既存コレクションにも自動適用される
hnsw_m = 48
hnsw_construction_ef = 400
hnsw_search_ef = 300

# サイト一括取り込み（Scrapy subprocess）
# Scrapy リクエスト間の遅延（秒）
site_ingest_delay_sec = 0.1
site_ingest_max_pages = 500
site_ingest_download_timeout = 30
site_ingest_timeout_sec = 7200
# エラー件数がこの値を超えるとクロールを中断
site_ingest_error_count = 10
