[project]
name = "rag-knowledge"
version = "0.1.0"
description = "RAG knowledge service with MCP server interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "chromadb>=1.5.3,<2",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.14,<1",
    "charset-normalizer>=3.0,<4",
    "bm25s>=0.3,<1",
    "fugashi>=1.3,<2",
    "unidic-lite>=1.0,<2",
    "pyyaml>=6.0,<7",
    "scrapy>=2.11,<3",
    "tzdata>=2024.1",
    "pymupdf4llm>=0.0.17",
    "py-common-lib",
    "youtube-transcript-api>=1.0,<2",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0,<2",
    "python-multipart>=0.0.9",
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
mineru = ["mineru[pipeline]", "torch>=2.6", "torchvision>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["fugashi", "bm25s"]

[[tool.mypy.overrides]]
module = ["fugashi", "fugashi.*", "bm25s", "bm25s.*", "markdownify", "markdownify.*", "scrapy", "scrapy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["mineru", "mineru.*", "torch", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["youtube_transcript_api", "youtube_transcript_api.*", "yt_dlp", "yt_dlp.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
follow_imports = "skip"
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
required_plugins = ["pytest-xdist"]

[tool.uv]
# uv sync で MinerU + PyTorch (CUDA 12.4) を自動インストール。
# CPU 環境では uv sync --no-group with-mineru で MinerU + PyTorch を除外する。
default-groups = ["dev", "with-mineru"]

# PyTorch CUDA 12.4 index
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
py-common-lib = { git = "https://github.com/becky3/py-common-lib" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.14.14",
    "types-PyYAML>=6.0",
]
# uv default-extras 未実装のため dependency-group で代替
with-mineru = ["rag-knowledge[mineru]"]
