[project]
name = "rag-knowledge"
version = "0.1.0"
description = "RAG knowledge service with MCP server interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "chromadb>=1.5.3,<2",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.14,<1",
    "charset-normalizer>=3.0,<4",
    "bm25s>=0.3,<1",
    "fugashi>=1.3,<2",
    "unidic-lite>=1.0,<2",
    "tzdata>=2024.1",
    "pymupdf4llm>=0.0.17",
    "py-common-lib",
]

[project.optional-dependencies]
# CPU 版（PyPI デフォルト）
mineru = ["mineru[pipeline]", "torch>=2.6", "torchvision>=0.21"]
# CUDA 版（GPU 推論用。CUDA 12.4 環境向け）
mineru-cuda = ["mineru[pipeline]", "torch>=2.6", "torchvision>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["fugashi", "bm25s"]

[[tool.mypy.overrides]]
module = ["fugashi", "fugashi.*", "bm25s", "bm25s.*", "markdownify", "markdownify.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["mineru", "mineru.*", "torch", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# PyTorch CUDA index（mineru-cuda extra 専用。CUDA 12.4 環境向け）
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
py-common-lib = { git = "https://github.com/becky3/py-common-lib" }
# mineru-cuda extra のみ CUDA index から取得。mineru extra は PyPI デフォルト（CPU 版）
torch = { index = "pytorch-cu124", extra = "mineru-cuda" }
torchvision = { index = "pytorch-cu124", extra = "mineru-cuda" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0",
    "ruff>=0.14.14",
]
