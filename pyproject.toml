[project]
name = "rag-knowledge"
version = "0.1.0"
description = "RAG knowledge service with MCP server interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "aiohttp>=3.9,<4",
    "mcp>=1.0,<2",
    "chromadb>=0.5,<1",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.14,<1",
    "charset-normalizer>=3.0,<4",
    "bm25s>=0.3,<1",
    "fugashi>=1.3,<2",
    "unidic-lite>=1.0,<2",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["fugashi", "bm25s"]

[[tool.mypy.overrides]]
module = ["fugashi", "fugashi.*", "bm25s", "bm25s.*", "markdownify", "markdownify.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0",
    "ruff>=0.14.14",
]
